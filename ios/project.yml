# XcodeGen spec for the Yard iOS app.
# On a Mac: `brew install xcodegen && cd ios && xcodegen`, then open Yard.xcodeproj.
# Sources are picked up by folder: adding a .swift file under Yard/ never needs an edit here.
# Owner: foundation agent (the live-activity agent may add the YardLiveActivity target below).

name: Yard
options:
  bundleIdPrefix: space.yardstore
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Yard:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Yard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.yardstore.app
        PRODUCT_NAME: Yard
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
    info:
      path: Yard/Resources/Info.plist
      properties:
        CFBundleDisplayName: Yard
        CFBundleName: Yard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: Yard uses your location to show independent brands, pop-ups and stockists around you.
        NSPhotoLibraryUsageDescription: Yard lets you pick photos to send to brands in your messages.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: space.yardstore.app
            CFBundleURLSchemes:
              - yard
    # dependencies:
    #   - target: YardLiveActivity   # live-activity agent: uncomment when the extension target exists

  # ---------------------------------------------------------------------------------------------
  # Live Activity widget extension: the live-activity agent adds it here. Expected shape:
  #
  # YardLiveActivity:
  #   type: app-extension
  #   platform: iOS
  #   deploymentTarget: "17.0"
  #   sources:
  #     - path: YardLiveActivity
  #     - path: Yard/Features/LiveActivity/Shared   # the ActivityAttributes shared with the app
  #   settings:
  #     base:
  #       PRODUCT_BUNDLE_IDENTIFIER: space.yardstore.app.LiveActivity
  #       TARGETED_DEVICE_FAMILY: "1"
  #   info:
  #     path: YardLiveActivity/Info.plist
  #     properties:
  #       CFBundleDisplayName: Yard
  #       NSExtension:
  #         NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # ...and in the Yard target: `dependencies: - target: YardLiveActivity` (embeds it).
  # ---------------------------------------------------------------------------------------------
