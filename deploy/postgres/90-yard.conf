# /etc/postgresql/<version>/main/conf.d/90-yard.conf — Yard on a 1-2 GB server.
# Roughly 256 MB for Postgres in total: two small databases, ~8 connections in normal use.
listen_addresses = 'localhost'
max_connections = 30
shared_buffers = 128MB
effective_cache_size = 384MB
work_mem = 2MB
maintenance_work_mem = 32MB
wal_buffers = 4MB
max_wal_size = 512MB
min_wal_size = 64MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
jit = off
max_worker_processes = 2
max_parallel_workers = 1
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 1
autovacuum_max_workers = 2
# Same text output and sorting as the development database (PGlite).
timezone = 'UTC'
log_timezone = 'UTC'
# Slow statements show up in the journal.
log_min_duration_statement = 1000
log_lock_waits = on
idle_in_transaction_session_timeout = 60s
