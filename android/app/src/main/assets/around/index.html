<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://tiles.openfreemap.org; font-src 'self'">
<title>Around</title>
<link rel="preload" href="fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="globe.css">
</head>
<body>
<!-- Yard Around's globe (Android). The same MapLibre GL JS 6.16.0 build, Natural Earth data, city
     coastlines, gazetteer, fonts and palette as the website's src/components/around/map/, all from
     the APK's assets. Kotlin drives it through window.yardGlobe.receive(msg); it answers through
     YardAndroid.post(json). -->
<div id="root" class="yard-around-map">
  <div id="map" role="region" aria-label="Map of brand places"></div>
  <div id="rim" aria-hidden="true"></div>
  <!-- The Snap-style title: Earth, a country, a city or a neighbourhood. -->
  <p id="title" class="font-display">Earth</p>
  <!-- Above every pin (z 2–3) and name (z 1); at rest it moves to a spot no pin covers. -->
  <div id="credits">
    <div class="credits-row">
      <span class="scale" role="img" hidden><span class="scale-label" aria-hidden="true"></span><span class="scale-bar" aria-hidden="true"></span></span>
      <span class="credits-main">
        <button type="button" class="credits-info" aria-label="Hide map credits" aria-expanded="true">
          <svg viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm16-40a8,8,0,0,1-8,8,16,16,0,0,1-16-16V128a8,8,0,0,1,0-16,16,16,0,0,1,16,16v40A8,8,0,0,1,144,176ZM112,84a12,12,0,1,1,12,12A12,12,0,0,1,112,84Z"/></svg>
        </button>
        <p class="credits-text">Natural Earth</p>
      </span>
    </div>
    <p id="note" hidden></p>
  </div>
  <!-- Wide screens: the website's desktop zoom and reset-north controls. -->
  <div id="controls" hidden>
    <button type="button" id="north" class="control" aria-label="Reset north" hidden><svg viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216ZM172.42,72.84l-64,32a8.05,8.05,0,0,0-3.58,3.58l-32,64A8,8,0,0,0,80,184a8.1,8.1,0,0,0,3.58-.84l64-32a8.05,8.05,0,0,0,3.58-3.58l32-64a8,8,0,0,0-10.74-10.74ZM138,138,97.89,158.11,118,118l40.15-20.07Z"/></svg></button>
    <button type="button" id="zoom-in" class="control" aria-label="Zoom in"><svg viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"/></svg></button>
    <button type="button" id="zoom-out" class="control" aria-label="Zoom out"><svg viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128Z"/></svg></button>
  </div>
  <!-- No WebGL 2 (or the map failed): the website's simplified SVG map, one button per city. -->
  <figure id="fallback" hidden>
    <div id="fallback-box">
      <svg id="fallback-svg" viewBox="0 30 1000 400" role="img" aria-label="Simplified world map with the cities that have places">
        <path id="fallback-land" d="" fill="#1a191f" stroke="rgba(245,245,245,0.12)" stroke-width="0.6"></path>
        <text id="fallback-failed" x="500" y="230" text-anchor="middle" fill="#858585" font-size="16" hidden>The map outline didn't load. The list below has every place.</text>
      </svg>
    </div>
    <figcaption>This device can't show the 3D map, so this is a simplified one.</figcaption>
  </figure>
</div>
<script src="vendor/topojson-client.min.js"></script>
<script type="module" src="globe.js"></script>
</body>
</html>
