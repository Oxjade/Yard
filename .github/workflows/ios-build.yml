# Compiles the iOS app on a GitHub macOS runner (no Mac needed), then saves the build result to the
# ios-ci branch (logs/latest.txt + logs/<commit>.txt) so it can be read with a plain git fetch.
name: iOS build check

on:
  push:
    branches: [iOSyard]
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build for the simulator (no signing)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          cd ios
          xcodebuild -version
          xcodebuild -project Yard.xcodeproj -target Yard -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=NO build 2>&1 | tee ../build.log

      - name: Unit tests on a simulator (no signing)
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          cd ios
          UDID=$(xcrun simctl list devices available | grep -E '^ +iPhone' | head -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "simulator: $UDID"
          # Illustration snapshot tests write PNG frames here (TEST_RUNNER_ vars reach the tests).
          mkdir -p "$GITHUB_WORKSPACE/snapshots"
          TEST_RUNNER_SNAPSHOT_DIR="$GITHUB_WORKSPACE/snapshots" xcodebuild -project Yard.xcodeproj -scheme Yard -destination "id=$UDID" -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test 2>&1 | tee ../test.log

      - name: Summarise
        if: always()
        run: |
          touch test.log
          if [ "${{ steps.build.outcome }}" = "success" ] && [ "${{ steps.test.outcome }}" = "success" ]; then RESULT=success; else RESULT=failure; fi
          {
            echo "commit: ${GITHUB_SHA}"
            echo "result: ${RESULT}"
            echo "errors: $(cat build.log test.log | grep -c ' error: ' || true)"
            echo "build: ${{ steps.build.outcome }} tests: ${{ steps.test.outcome }}"
            echo "tests: $(grep -E 'Executed [0-9]+ tests?' test.log | tail -1 || true)"
            echo "----- errors (deduplicated) -----"
            cat build.log test.log | grep ' error: ' | sed 's|^.*/ios/|ios/|' | sort -u | head -400 || true
            echo "----- last 60 lines -----"
            tail -60 build.log
            echo "----- last 40 test lines -----"
            tail -40 test.log
          } > summary.txt
          cat summary.txt

      - name: Upload snapshot frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-snapshots-${{ github.sha }}
          path: snapshots/
          if-no-files-found: ignore

      - name: Save the result to the ios-ci branch
        if: always()
        run: |
          git config user.name "ios-build-check"
          git config user.email "ios-build-check@users.noreply.github.com"
          git fetch origin ios-ci || true
          mkdir -p /tmp/out && cp summary.txt /tmp/out/
          rm -rf /tmp/shots && mkdir -p /tmp/shots && cp snapshots/*.png /tmp/shots/ 2>/dev/null || true
          if git rev-parse --verify origin/ios-ci >/dev/null 2>&1; then git checkout -B ios-ci origin/ios-ci; else git checkout --orphan ios-ci && git rm -rf . >/dev/null; fi
          mkdir -p logs
          cp /tmp/out/summary.txt "logs/${GITHUB_SHA}.txt"
          cp /tmp/out/summary.txt logs/latest.txt
          if ls /tmp/shots/*.png >/dev/null 2>&1; then mkdir -p "shots/${GITHUB_SHA}" && cp /tmp/shots/*.png "shots/${GITHUB_SHA}/" && git add shots; fi
          git add logs && git commit -m "iOS build ${GITHUB_SHA::7}: ${{ steps.build.outcome }}" && git push origin ios-ci

      - name: Fail the check when the build or the tests failed
        if: steps.build.outcome != 'success' || steps.test.outcome != 'success'
        run: exit 1
